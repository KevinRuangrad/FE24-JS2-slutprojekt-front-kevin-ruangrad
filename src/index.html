<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrumboard</title>
    <link rel="shortcut icon" href="#" type="image/x-icon" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <script src="./main.ts" type="module"></script>
  </head>
  <body>
    <h1>Scrum Board</h1>
    <div class="add-task-form">
      <h2>Add New Task</h2>
      <form id="task-form">
        <label for="title">Title:</label>
        <input type="text" id="task-input" name="title" placeholder="Enter task name">
        <input type="text" id="task-description" name="description" placeholder="Enter task description">
        <select id="task-category" name="category">
          <option value="none">Select Category</option>
          <option value="ux">UX</option>
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
        </select>
        <button type="submit">Add Task</button>
      </form>
    </div>

<div class="add-member">
  <h2>Add a member</h2>
  <form id="add-member-form">
    <input type="text" id="member-input" name="name" placeholder="Enter member name">
    <div class="checkbox-group">
      <div class="checkbox-item">
        <input type="checkbox" id="ux" name="roles" value="ux">
        <label for="ux">UX</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="frontend" name="roles" value="frontend">
        <label for="frontend">Frontend</label>
      </div>
      <div class="checkbox-item">
        <input type="checkbox" id="backend" name="roles" value="backend">
        <label for="backend">Backend</label>
      </div>
    </div>
    <button type="submit" id="add-member">Add Member</button>
  </form>
</div>
    <div class="filters">
      <div class="filter-group">
        <h2>Filter:</h2>
          <span class="icon">👤</span>
          <h2>Member</h2> 
          <div class="filter-dropdown custom-select">
            <select id="member-filter" >
              <option value="all">All</option>
              <!-- Add options for each member -->
            </select>
          </div>
        </button>
      </div>
      <div class="filter-group">
          <span class="icon">📂</span> 
          <h2>Category</h2>
          <div id="category-filter" class="filter-dropdown custom-select">
            <select>
              <option value="all">All</option>
              <option value="dev backend">Backend Dev</option>
              <option value="dev frontend">Frontend Dev</option>
              <option value="UX">UX</option>
            </select>
          </div>
        </button>
      </div>

      <div class="filter-group">
          <span class="icon">🕒</span> 
          <h2>Sort by Timestamp</h2>
          <div id="sort-timestamp" class="filter-dropdown custom-select">
            <select>
              <option value="newest">Newest to Oldest</option>
              <option value="oldest">Oldest to Newest</option>
            </select>
          </div>
        </button>
      </div>

      <div class="filter-group">
          <span class="icon">🔤</span> 
          <h2>Sort by Title</h2>
          <div id="sort-title" class="filter-dropdown custom-select">
            <select>
              <option value="ascending">A to Z</option>
              <option value="descending">Z to A</option>
            </select>
          </div>
        </button>
      </div>
    </div>
    <div class="scrum-board">
      <div class="column" id="todo">
        <h2>To Do</h2>
        <div class="task-list" id="todo-list">
          <!-- Tasks will go here -->
        </div>
      </div>
      <div class="column" id="inprogress">
        <h2>In Progress</h2>
        <div class="task-list" id="inprogress-list">
          <!-- Tasks will go here -->
        </div>
      </div>
      <div class="column" id="done">
        <h2>Done</h2>
        <div class="task-list" id="done-list">
          <!-- Tasks will go here -->
        </div>
      </div>
    </div>
  </body>
</html>
